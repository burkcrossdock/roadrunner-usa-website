services:
  - type: web
    name: roadrunner-usa
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FORM_TO_EMAIL
        value: info@rdrunnerusa.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: FORM_WEBHOOK_URL
        sync: false
      - key: SUBMISSIONS_DIR
        sync: false
